[project]
name = "elastra"
version = "0.1.0"
description = "Mattress and trampoline models in MuJoCo for humanoid get-up learning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mujoco==3.4.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "onnxruntime==1.22.0",
    "torch==2.14.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
]

[project.scripts]
elastra-download-assets = "elastra.assets:main"
elastra-evaluate = "elastra.evaluation:main"
elastra-train = "elastra.training:main"
elastra-load-response = "elastra.load_response:main"
elastra-indentation = "elastra.indentation:main"
elastra-figures = "elastra.figures:main"
elastra-make-host-initial-states = "elastra.initial_states:main"

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.12"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elastra"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = ["outputs", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
