# The HoST residual policy (elastra/training.py), trained from scratch.
controller: host
description: >-
  HoST residual policy: 1000 PPO updates on the relative-height success criterion;
  mattress a8, a16, a32, a64, rigid ground and trampolines a1, a2 without the position
  observation for 500 updates, then with it (its input columns starting at zero) and
  a16, a32, a64 replaced by a1, a2, a4
seed: 283402
# 256 environments; the environments of a surface keep it for a whole curriculum stage.
# The order of the surfaces is the order of the shuffled environment list.
num_envs: 256
surfaces:
  mattress/a16: 32
  mattress/a32: 32
  mattress/a64: 32
  mattress/a8: 32
  rigid: 51
  trampoline/a2: 38
  trampoline/a1: 39
curriculum:
  # from update 500 the environments of a16, a32, a64 move to a1, a2, a4, and the residual
  # observes the robot's position
  - from_update: 500
    position_observation: true
    replace:
      mattress/a16: mattress/a1
      mattress/a32: mattress/a2
      mattress/a64: mattress/a4
# seed offset of HoST's observation noise generators in training
observation_noise_seed_offset: 5000
# the 32 HoST training initial states (data/initial_states/host.npz, split "train")
initial_states: train
# an episode: the 250 control steps of a HoST episode after its 30 unactuated steps
horizon_control_steps: 220
rollout_steps: 64
updates: 1000
ppo:
  learning_rate: 3.0e-4
  gamma: 0.995
  gae_lambda: 0.95
  clip_ratio: 0.2
  epochs: 4
  minibatches: 4
  value_coef: 0.5
  entropy_coef: 0.0
  max_grad_norm: 1.0
  # stop the epochs of an update once an epoch's mean approximate KL exceeds this
  target_kl: 0.05
reward:
  height_weight: 1.0
  upright_weight: 0.5
  standing_bonus: 1.0
  completion_bonus: 20.0
  exit_penalty: 10.0
  # torso height of HoST's standing pose (root at 0.793 m), forward kinematics
  standing_torso_z_m: 0.8470000000000001
# leaving the task area is checked once per control step in training (every physics
# step in the evaluation)
task_area_every_physics_step: false
# worker processes that step the environments (environment e on worker e mod workers)
workers: 32
# threads of the PPO update
torch_threads: 2
checkpoint_every: 10
# policy.pt: the networks of the last update
policy_checkpoint: last
# continue from the latest checkpoint in `out` if there is one (every environment restarts)
resume: true
out: outputs/train/host
