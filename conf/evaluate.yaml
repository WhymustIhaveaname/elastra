# elastra-evaluate: run a controller from the fixed test initial states.
defaults:
  - config
  - _self_
# host or protomotions
controller: host
# a residual policy checkpoint, or null for the original controller alone
policy: checkpoints/host_residual.pt
# test (HoST: 96 states; ProtoMotions: 40 states) or train
initial_states: test
surfaces:
  - mattress/a1
  - mattress/a2
  - mattress/a4
  - mattress/a8
  - mattress/a16
  - mattress/a32
  - mattress/a64
  - trampoline/a1
  - trampoline/a2
  - rigid
# ProtoMotions: groups of surfaces whose environments of one clip run as one batch, every
# evaluated surface in exactly one block (the residual's float32 matrix products differ in
# the last bits with the batch size, so the blocks are part of a run's definition)
protomotions_blocks:
  - [mattress/a1, mattress/a2]
  - [mattress/a64, rigid, trampoline/a1]
  - [mattress/a8, mattress/a16, mattress/a32]
  - [trampoline/a2, mattress/a4]
# parallel worker processes (one batch of environments each), physics threads per worker,
# and torch threads of the residual policy per worker
workers: 4
threads: 1
torch_threads:
  host: 1
  protomotions: 4
out: outputs/evaluation/${controller}
